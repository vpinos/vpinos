# VPinOS override of calamares-settings-debian's settings.conf --
# takes precedence automatically since includes.chroot content is
# copied after packages are installed (confirmed via this project's own
# build-stage ordering: a hook fixing permissions on an includes.chroot
# file already worked, meaning includes land before hooks/later stages
# run). Differs from the stock file in three ways:
#
# 1. `users` and `displaymanager` are removed from both sequences
#    below: this image uses a hardcoded `vpinos` account baked into the
#    squashfs at build time (0060-create-vpinos-user.hook.chroot), not
#    an interactively-chosen one, and there's no display manager here
#    at all -- just a systemd getty autologin into a console menu.
#    Since Calamares's `unpackfs` module copies that squashfs (vpinos
#    account, password, and all) verbatim to the target before any
#    exec-phase module would have run anyway, skipping these two
#    modules changes nothing else about the install, it just removes an
#    interactive step that would otherwise create a second, unwanted
#    account.
# 2. `branding: vpinos` instead of `debian` -- see
#    etc/calamares/branding/vpinos/ alongside this file.
# 3. `sources-final` is removed from the exec sequence. That step
#    overwrites the target's /etc/apt/sources.list with Debian's stock
#    template, which only has `main non-free-firmware` -- dropping
#    `contrib` and `non-free`. Without it the target keeps the
#    sources.list live-build wrote into the squashfs (all four areas:
#    `main contrib non-free non-free-firmware`, plus updates, security
#    and backports), so installed and live systems match.
# 4. `sources-media` and `sources-media-unmount` are removed from the
#    exec sequence. Their helper script
#    (/usr/share/calamares/helpers/calamares-sources-media, shipped by
#    calamares-settings-debian) bind-mounts the live medium into the
#    target and adds `deb [trusted=yes] file:$MEDIUM_PATH trixie main`
#    as an apt source, so extra packages already bundled on the medium
#    can be installed offline during setup -- but it assumes every
#    Debian live image carries its own dists/pool apt archive on the
#    medium itself (true for official Debian live images built with
#    debian-installer support). VPinOS builds with
#    `LB_DEBIAN_INSTALLER="none"` (see config/binary) and has no
#    dists/pool structure on the medium at all -- confirmed directly,
#    not assumed (`find binary -maxdepth 1 -iname dists -o -iname pool`
#    on a real build returns nothing). That source has therefore always
#    been broken on this image; it just went unnoticed because the
#    helper script has no `set -e` and never checks its own
#    `apt-get update`'s exit code, so the failure was silently
#    swallowed on every install, long before any of this project's own
#    size work. It only became visible once `packages.conf`'s
#    `update_db: true` added a *second*, exit-code-checked
#    `apt-get update` later in the sequence (see that file's own
#    comment, and notes/vpinos.md, for the full chain that led here) --
#    that one hit the same broken source and correctly failed the
#    install instead of silently continuing. Confirmed directly from a
#    real failed install's session log
#    (~/.cache/calamares/session.log): `apt-get update` exit 100,
#    `Err:4 file:/run/live/medium trixie/main amd64 Packages` --
#    `File not found` for every compression variant, because that
#    archive path never existed on this image's medium in the first
#    place. VPinOS doesn't need this feature anyway -- packages come
#    from real Debian mirrors plus vpinos/deb-repo, never a local
#    on-medium archive -- so the clean fix is removing both jobs
#    entirely, not patching the helper script.
#
# Configuration file for Calamares
# Syntax is YAML 1.2
---

# "local" is LIBDIR/calamares/modules with settings in SHARE/calamares/modules
modules-search: [ local, /usr/lib/calamares/modules ]

# If this is set to true, Calamares refers to itself as a "setup program"
# rather than an "installer". Defaults to the value of dont-chroot, but
# Calamares will complain if this is not explicitly set.
oem-setup: false

# If this is set to true, the "Cancel" button will be disabled entirely.
# The button is also hidden from view.
#
# This can be useful if when e.g. Calamares is used as a post-install
# configuration tool and you require the user to go through all the
# configuration steps.
#
# Default is false, but Calamares will complain if this is not explicitly set.
#
# YAML: boolean.
disable-cancel: false

# If this is set to true, the "Cancel" button will be disabled once
# you start the 'Installation', meaning there won't be a way to cancel
# the Installation until it has finished or installation has failed.
#
# Default is false, but Calamares will complain if this is not explicitly set.
#
# YAML: boolean.
disable-cancel-during-exec: false

# If this is set to true, then once the end of the sequence has
# been reached, the quit (done) button is clicked automatically
# and Calamares will close. Default is false: the user will see
# that the end of installation has been reached, and that things are ok.
#
#
quit-at-end: false

sequence:
# Phase 1 - prepare.
# View modules are shown as UI pages, jobs from job modules
# are executed immediately in the background.
# Jobs should be executed sparingly (if at all) in this phase.
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - summary

# Phase 2 - install.
# View modules are not shown. Only the view modules shown
# in the previous phase are allowed, their names should be
# added here as placeholders to specify the order in which
# view module jobs should be enqueued. Job modules are
# also allowed.
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - umount

# Phase 3 - postinstall.
# View modules are shown as UI pages, jobs from job modules are
# executed immediately in the background.
# Jobs should be executed sparingly (if at all) in this phase.
- show:
  - finished

# A branding component is a directory, either in
# SHARE/calamares/branding or in /etc/calamares/branding
# (the latter takes precedence). The directory must contain a
# YAML file branding.desc which may reference additional resources
# (such as images) as paths relative to the current directory.
# Only the name of the branding component (directory) should be
# specified here, Calamares then takes care of finding it and
# loading the contents.
branding: vpinos

# If this is set to true, Calamares will show an "Are you sure?" prompt right
# before each execution phase, i.e. at points of no return. If this is set to
# false, no prompt is shown. Default is false.
#
# YAML: boolean.
prompt-install: false

# If this is set to true, Calamares will execute all target environment
# commands in the current environment, without chroot. This setting should
# only be used when setting up Calamares as a post-install configuration tool,
# as opposed to a full operating system installer.
#
# Some official Calamares modules are not expected to function with this
# setting. (e.g. partitioning seems like a bad idea, since that is expected to
# have been done already)
#
# Default is false (for a normal installer).
#
# YAML: boolean.
dont-chroot: false
