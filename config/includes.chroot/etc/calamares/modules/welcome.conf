# VPinOS override of calamares-settings-debian's welcome.conf -- same
# override mechanism as ../settings.conf alongside this file.
#
# Adds `internet` to both `check:` and `required:` below (otherwise
# unchanged from the stock file). Needed as a second half of the
# ../modules/packages.conf fix (`update_db: true`) -- confirmed directly,
# not guessed: `update_db` only runs if Calamares's own `hasInternet`
# global-storage value is true, and that value is only ever set by the
# `welcome` module's own internet-connectivity checker
# (`GeneralRequirements::checkHasInternet()`, confirmed present in
# `libcalamares_viewmodule_welcome.so`), which only runs for requirement
# names actually listed in `check:` below. The stock list
# (storage/ram/power/root) never includes `internet`, so that checker
# never ran, `hasInternet` was never set, and `update_db: true` silently
# no-opped -- confirmed by testing `update_db: true` alone (1.0.36): same
# byte-for-byte "Package Manager error" as before it was added, not the
# different "could not prepare updates" error `update_db` itself raises
# on a real failed `apt-get update` -- proving it never even ran.
#
# `internet` is in `required:` too, not just `check:` -- deliberately,
# not just to satisfy `hasInternet`. Without it, a cabinet with no
# connection would sail straight through welcome/partition/mount and
# only hit the (still-fatal) package-manager error during `packages`,
# well after the disk has already been wiped and partitioned -- the
# worst possible point to fail. Gating on `internet` here fails fast, on
# the welcome page, before anything destructive happens.
#
# `internetCheckUrl` was deliberately left unset -- Calamares's own
# default is used (confirmed via the welcome module's own string table:
# "... is undefined in welcome.conf, reverting to default"). No reason
# found yet to need a different one, but if a real cabinet's install
# fails this check despite having a working connection, start by probing
# whatever host that default actually is -- it may be blocked/slow on
# networks the default assumed.
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    requiredStorage:    15
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
        - internet
    required:
        - storage
        - ram
        - root
        - internet
