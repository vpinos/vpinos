# VPinOS override of calamares-settings-debian's packages.conf -- same
# override mechanism as ../settings.conf alongside this file (includes.chroot
# content lands after packages are installed, so this takes precedence over
# the stock file automatically).
#
# Adds `update_db: true` to the stock operations list below (otherwise
# unchanged). Needed because the image now ships with --apt-indices false
# (see README.md's build instructions and notes/vpinos.md): the installed
# system is a straight copy of the squashfs, which carries zero apt indices
# to keep the ISO smaller. Without this, the `remove` operations below fail
# outright -- confirmed directly, not guessed: apt-get can't resolve an
# already-installed package's name to a removal target without index data,
# failing every single removal with "E: Unable to locate package" and
# aborting the whole install ("Package Manager error", exit code 100).
# `update_db: true` makes Calamares run `apt-get update` in the target
# chroot (confirmed from this exact Calamares version's own
# modules/packages/main.py: PMApt.update_db() -> ["apt-get", "update"])
# before the operations below run, so apt has real index data to resolve
# these removals against.
#
# Real tradeoff, not a free fix -- see README.md's installation
# requirements: this makes a working network connection a hard requirement
# during install, not just for the sample tables on first boot. Confirmed
# from the module's own source: `update_db` only runs if Calamares's
# internet-connectivity check (`hasInternet`) is true -- if there's no
# connection, it's silently skipped and the install fails the exact same
# way as before. And when it does run, a failed `apt-get update` is fatal
# (wrapped in try/except that aborts the install with its own "Package
# Manager error"), not soft-failed -- and since this image's settings.conf
# deliberately skips the `sources-final` module to keep every configured
# apt source on the target (not just Debian's own), that `apt-get update`
# has to successfully reach all of them: the Debian mirrors, security,
# the pinned trixie-backports snapshot, github.com/vpinos/deb-repo,
# developer.download.nvidia.com, and dl.google.com.
#
# `update_system: true` was deliberately NOT added -- confirmed from the
# same source file that it's a no-op for the apt backend (`PMApt.
# update_system()` is just `pass`; only meaningful for apk/dnf/pacman).
backend: apt

operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'

update_db: true
