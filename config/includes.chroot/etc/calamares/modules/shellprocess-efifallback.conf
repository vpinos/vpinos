# VPinOS: gives the EFI fallback loader a grub.cfg. Runs right after
# `bootloader` in ../settings.conf (instance `shellprocess@efifallback`).
#
# The stock bootloader.conf (calamares-settings-debian) has
# `installEFIFallback: true`, and Calamares 3.3.14's bootloader module
# (modules/bootloader/main.py, install_grub) then copies only
# EFI/VPinOS/grubx64.efi to EFI/boot/bootx64.efi. Debian's signed GRUB
# looks for grub.cfg next to its own binary (and in EFI/debian/), and
# neither exists there, so booting through the removable path stops at a
# bare `grub>` prompt. Firmware that puts its own "UEFI OS" entry for that
# path first (reported on an MSI laptop) hits it on every boot.
#
# Turning installEFIFallback off would break firmware that only boots the
# removable path, so copy the stub config instead. The stub only points at
# /boot/grub/grub.cfg by filesystem UUID, so it never needs refreshing.
# The ESP is FAT (case-insensitive), so EFI/boot also matches EFI/BOOT.
# BIOS installs have no /boot/efi and skip it. The leading `-` keeps a
# failure here from failing the whole install.
---
dontChroot: false
timeout: 30
script:
  - "-if [ -f /boot/efi/EFI/VPinOS/grub.cfg ] && [ -d /boot/efi/EFI/boot ]; then cp /boot/efi/EFI/VPinOS/grub.cfg /boot/efi/EFI/boot/grub.cfg; fi"
