source /boot/grub/config.cfg

# Live boot
@LINUX_LIVE@

# VPinOS: the same live boot, with the settings saved on the USB stick
# (vpinos-core's vpinos-persistence.sh makes the vpinos-data partition
# on the first boot). Not the default: the menu has no timeout, so it's
# picked each time. Same entry in syslinux_common/live.cfg.in for BIOS.
# Copied from live-build's own grub-pc/grub.cfg (1:20250505+deb13u1),
# which it otherwise replaces: keep the rest in step when live-build
# changes. Don't use the placeholder words in these comments, live-build
# substitutes them anywhere in the file.
menuentry "Live system (@FLAVOUR_LIVE@, save settings to USB)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-label=vpinos-data
	initrd	@INITRD_LIVE@
}

# You can add more entries like this
# menuentry "Alternate live boot" {
# linux @KERNEL_LIVE@ @APPEND_LIVE@ custom options here
# initrd @INITRD_LIVE@
# }
# menuentry "Alternate graphical installer" {
# linux @KERNEL_GI@ @APPEND_GI@ custom options here
# initrd @INITRD_GI@
# }
# menuentry "Alternate textual installer" {
# linux @KERNEL_DI@ @APPEND_DI@ custom options here
# initrd @INITRD_DI@
# }

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
